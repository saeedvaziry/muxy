[workspace]
resolver = "3"
members = [
    "crates/muxy-core",
    "crates/muxy-protocol",
    "crates/muxy-wire",
    "crates/muxy-transport",
    "crates/muxy-pty",
    "crates/muxy-terminal",
    "crates/muxy-server-core",
    "crates/muxy-server",
    "crates/muxy-app-core",
    "crates/muxy-settings",
    "crates/muxy-client",
    "crates/muxy-app",
    "crates/muxy-ui",
]

# Current boundary policy, not a permanent crate list. Structural changes update
# this table and the affected crate-level documentation together.
[workspace.metadata.architecture.allowed-dependencies]
muxy-core = []
muxy-protocol = ["muxy-core"]
muxy-wire = ["muxy-protocol"]
muxy-transport = []
muxy-pty = []
muxy-terminal = []
muxy-server-core = [
    "muxy-core",
    "muxy-protocol",
    "muxy-wire",
    "muxy-transport",
    "muxy-pty",
    "muxy-terminal",
]
muxy-server = ["muxy-core", "muxy-protocol", "muxy-server-core", "muxy-transport", "muxy-wire"]
muxy-settings = ["muxy-core"]
muxy-app-core = ["muxy-core", "muxy-protocol", "muxy-settings"]
muxy-client = ["muxy-core", "muxy-protocol", "muxy-wire", "muxy-transport"]
muxy-app = ["muxy-core", "muxy-app-core", "muxy-client", "muxy-settings", "muxy-protocol", "muxy-ui"]
muxy-ui = ["muxy-core"]

[workspace.metadata.architecture.allowed-dev-dependencies]
muxy-app = ["muxy-wire"]
muxy-client = ["muxy-server-core"]

[workspace.package]
version = "2.0.0-alpha-0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/saeedvaziry/muxy"
authors = ["Saeed Vaziry"]
publish = false

[workspace.dependencies]
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

[profile.bench]
inherits = "release"
